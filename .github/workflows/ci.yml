name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbfile-dev libsecret-1-dev libkrb5-dev \
            build-essential python3 python-is-python3

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Guard against restored upstream workflows
        run: node --experimental-strip-types --test build/npm/integrityWorkflows.test.ts

      - name: Compile integrity-ai extension
        run: npm run gulp -- compile-extension:integrity-ai

      - name: Compile check (client)
        run: npm run compile

  nightly-linux:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbfile-dev libsecret-1-dev libkrb5-dev \
            build-essential python3 python-is-python3

      - name: Install dependencies
        run: npm ci

      - name: Build linux x64
        run: npm run gulp -- vscode-linux-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: integrity-linux-x64
          path: ../VSCode-linux-x64
          retention-days: 7
