name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbfile-dev libsecret-1-dev libkrb5-dev \
            build-essential python3 python-is-python3

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            build/node_modules
            extensions/node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Compile integrity-ai extension
        run: yarn gulp compile-extension:integrity-ai

      - name: Compile check (client)
        run: yarn compile

  nightly-linux:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbfile-dev libsecret-1-dev libkrb5-dev \
            build-essential python3 python-is-python3

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Build linux x64
        run: yarn gulp vscode-linux-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: integrity-linux-x64
          path: ../VSCode-linux-x64
          retention-days: 7
